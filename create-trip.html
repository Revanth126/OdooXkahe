<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveloop - Create New Trip</title>
    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/animations.css">
    <style>
        body { padding-top: 100px; padding-bottom: 4rem; }
        .page-header { margin-bottom: 2rem; text-align: center; }
        .page-header h1 { font-size: 2.5rem; }
        .page-header p { color: var(--text-secondary); font-size: 1.1rem; }
        
        .form-card {
            background-color: var(--elevated-card-bg);
            padding: 2.5rem;
            border-radius: var(--radius-card);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            max-width: 800px;
            margin: 0 auto;
        }

        .row { display: flex; gap: 1.5rem; }
        .col { flex: 1; }
        
        @media (max-width: 768px) {
            .row { flex-direction: column; gap: 0; }
        }

        .upload-zone {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-input);
            padding: 3rem 2rem;
            text-align: center;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            background-color: var(--input-bg);
        }
        .upload-zone:hover {
            border-color: var(--primary);
            background-color: rgba(0, 180, 216, 0.05);
            color: var(--primary);
        }
        .upload-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <!-- Header / Navigation -->
    <header>
        <div class="container navbar">
            <a href="dashboard.html" class="logo">Traveloop</a>
            <nav class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="my-trips.html">My Trips</a>
                <a href="explore.html">Explore</a>
            </nav>
            <div class="user-profile">
                <img src="https://ui-avatars.com/api/?name=User&background=FF5A5F&color=fff" alt="User Profile" id="userAvatar">
            </div>
        </div>
    </header>

    <main class="container animate-fade-in-up">
        
        <div class="page-header">
            <h1>Design Your Dream Trip</h1>
            <p>Enter the basic details to start planning your itinerary.</p>
        </div>

        <div class="form-card">
            <form action="itinerary-builder.html" method="GET" id="createTripForm">
                
                <div class="form-group">
                    <label class="form-label" for="tripName">Trip Name</label>
                    <input type="text" id="tripName" class="form-control" placeholder="e.g., Summer Euro Trip 2026" required>
                </div>

                <div class="row">
                    <div class="col form-group">
                        <label class="form-label" for="startDate">Start Date</label>
                        <input type="date" id="startDate" class="form-control" required>
                    </div>
                    <div class="col form-group">
                        <label class="form-label" for="endDate">End Date</label>
                        <input type="date" id="endDate" class="form-control" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="tripDescription">Trip Description (Optional)</label>
                    <textarea id="tripDescription" class="form-control" placeholder="What is the vibe of this trip? e.g., A relaxing beach getaway with a bit of historical sightseeing."></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Cover Photo (Optional)</label>
                    <div class="upload-zone" onclick="document.getElementById('fileUpload').click()">
                        <span class="upload-icon">📸</span>
                        <span>Drag and drop an image here, or <strong>click to browse</strong></span>
                        <input type="file" id="fileUpload" style="display: none;" accept="image/*">
                    </div>
                </div>

                <div class="form-actions">
                    <a href="dashboard.html" class="btn-secondary" style="text-decoration: none;">Cancel</a>
                    <button type="submit" class="btn-primary">Create Trip & Continue</button>
                </div>
            </form>
        </div>

    </main>

    <script>
        // Simple form validation enhancement
        document.getElementById('createTripForm').addEventListener('submit', function(e) {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            
            if(start && end && start > end) {
                e.preventDefault();
                alert('End Date must be after Start Date!');
            }
        });
    </script>
</body>
</html>
