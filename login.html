<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveloop - Login</title>
    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <main class="container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
        <h1 class="logo" style="font-size: 3rem; margin-bottom: 2rem;">Traveloop</h1>
        <div class="card" style="width: 100%; max-width: 400px; padding: 2rem;">
            <h2 style="margin-bottom: 1.5rem; text-align: center;">Welcome Back</h2>
            <form action="dashboard.html">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" required placeholder="user@example.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Log In</button>
            </form>
            <p style="text-align: center; margin-top: 1rem; color: var(--text-secondary);">
                Don't have an account? <a href="#" style="color: var(--primary);">Sign up</a>
            </p>
        </div>
    </main>
</body>
</html>
